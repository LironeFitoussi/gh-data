name: Build & Upload Artifacts

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    # needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
            name: site-build
            path: |
                dist/
                package.json
            retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
        - name: Download build artifact
          uses: actions/download-artifact@v6
          with:
            name: site-build
        
        - name: List files
          run: ls -la

        - name: Deploy
          run: |
            echo "Deploying"
            sleep 3
            echo "Your site is live at https://baba-is-here.com"



